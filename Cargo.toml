[package]
name = "papeli"
version = "0.1.0"
edition = "2024"
authors = ["Lumen Pink <lumen@lumen.pink>"]
description = "Filtro Milter Postfix em Rust para envelopar e-mails corporativos em papel de carta MJML responsivo com assinatura inteligente"
readme = "README.md"
repository = "https://codeberg.org/lumenpink/papeli"
license = "GPL-3.0-or-later"
keywords = ["milter", "postfix", "email", "mjml", "stationery"]
categories = ["email", "network-programming"]

[dependencies]
mail-parser = "0.11"
mail-builder = "1.0"
ammonia = "4.2"
scraper = "0.27"
mrml = "6.0"
minijinja = "2.7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
notify = "8.0"

[dev-dependencies]
sha2 = "0.10"
