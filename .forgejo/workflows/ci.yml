name: CI & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Test & Build (Rust)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "Test & Build (Rust)"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4

      - name: "Cache Cargo"
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: "Install stable Rust"
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: "cargo test — Unit & Integration Tests"
        run: cargo test --all-features -- --test-threads=4

      - name: "cargo clippy — Lints"
        run: cargo clippy --all-features -- -D warnings

      - name: "cargo fmt — Format check"
        run: cargo fmt -- --check

      - name: "cargo build --release"
        run: cargo build --release

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy Static Documentation Site (Cloudflare + Codeberg Fallback)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-site:
    name: "Deploy Documentation Site (papeli.2lp.in)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verify Site Integrity"
        run: |
          echo "=== Verificando integridade do site ==="
          test -f site/index.html    || (echo "ERRO: site/index.html não encontrado!" && exit 1)
          test -f site/docs.html     || (echo "ERRO: site/docs.html não encontrado!"  && exit 1)
          test -f site/downloads.html || (echo "ERRO: site/downloads.html não encontrado!" && exit 1)
          test -f site/assets/style.css || (echo "ERRO: site/assets/style.css não encontrado!" && exit 1)
          test -f site/_headers      || (echo "ERRO: site/_headers não encontrado!"   && exit 1)
          echo "✅ Todos os arquivos do site estão presentes."

      - name: "Deploy to Cloudflare Workers (papeli.2lp.in)"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) not configured. Skipping Cloudflare deployment."
          else
            echo "Publishing static documentation site to papeli.2lp.in via Cloudflare Workers..."
            npx wrangler deploy || echo "::warning::Cloudflare deployment exited with status $?. Continuing with Codeberg Pages fallback."
          fi

      - name: "Deploy to Codeberg Pages (Fallback Redundancy)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@codeberg.org"

          WORKTREE_DIR=$(mktemp -d)
          if git ls-remote --exit-code --heads origin pages > /dev/null 2>&1; then
            git fetch origin pages:pages
            git worktree add "$WORKTREE_DIR" pages
          else
            git worktree add --orphan -b pages "$WORKTREE_DIR"
          fi

          rm -rf "${WORKTREE_DIR:?}"/*
          cp -r site/* "$WORKTREE_DIR/"

          cd "$WORKTREE_DIR"
          # Garantir que não haja CNAME no branch pages
          rm -f CNAME
          git add -A
          if git diff --staged --quiet; then
            echo "Sem mudanças no site para publicar no Codeberg Pages."
          else
            git commit -m "docs(site): deploy documentation to Codeberg Pages [skip ci]"
            git push origin pages
            echo "✅ Site publicado no Codeberg Pages com sucesso."
          fi
          cd - > /dev/null
          git worktree remove "$WORKTREE_DIR" --force || true
